<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Kisan AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #f8f9fa;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .navbar-brand i {
            margin-right: 8px;
        }
        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            max-width: 800px;
            margin: 20px auto;
            width: 100%;
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            max-height: 60vh;
        }
        .message {
            margin-bottom: 15px;
            display: flex;
        }
        .user-message {
            justify-content: flex-end;
        }
        .assistant-message {
            justify-content: flex-start;
        }
        .bubble {
            max-width: 70%;
            padding: 12px 18px;
            border-radius: 20px;
            font-size: 1rem;
            line-height: 1.4;
        }
        .user-message .bubble {
            background-color: #28a745;
            color: white;
            border-bottom-right-radius: 5px;
        }
        .assistant-message .bubble {
            background-color: #e9ecef;
            color: #333;
            border-bottom-left-radius: 5px;
        }
        .timestamp {
            font-size: 0.7rem;
            color: #888;
            margin-top: 5px;
            text-align: right;
        }
        .input-area {
            padding: 20px;
            background: #f8f9fa;
            border-top: 1px solid #dee2e6;
            display: flex;
            gap: 10px;
        }
        .input-area input {
            flex: 1;
            border-radius: 25px;
            padding: 12px 20px;
            border: 1px solid #ced4da;
        }
        .input-area button {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: none;
            background-color: #28a745;
            color: white;
            font-size: 1.2rem;
            cursor: pointer;
            transition: background 0.2s;
        }
        .input-area button:hover {
            background-color: #218838;
        }
        .voice-btn.active {
            background-color: #dc3545;
        }
        .info-text {
            text-align: center;
            color: #6c757d;
            margin-top: 10px;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-success">
        <div class="container">
            <a class="navbar-brand" href="/dashboard">
                <i class="fas fa-seedling"></i> Kisan AI Dashboard
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/logout">Logout</a>
            </div>
        </div>
    </nav>

    <!-- Chat Interface -->
    <div class="chat-container">
        <div class="chat-messages" id="chatMessages">
            <!-- Messages will be inserted here dynamically -->
        </div>

        <div class="input-area">
            <input type="text" id="messageInput" placeholder="Type your question or use voice..." />
            <button id="voiceBtn" class="voice-btn" title="Click and speak">
                <i class="fas fa-microphone"></i>
            </button>
            <button id="sendBtn" title="Send">
                <i class="fas fa-paper-plane"></i>
            </button>
        </div>
        <div class="info-text" id="listeningIndicator" style="display: none;">
            <i class="fas fa-microphone-alt text-danger"></i> Listening... (speak now)
        </div>
    </div>

    <script>
        // DOM elements
        const chatMessages = document.getElementById('chatMessages');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const voiceBtn = document.getElementById('voiceBtn');
        const listeningIndicator = document.getElementById('listeningIndicator');

        // Web Speech API support check
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        const synth = window.speechSynthesis;

        if (!SpeechRecognition) {
            alert('Your browser does not support voice recognition. Please use Chrome or Edge.');
            voiceBtn.disabled = true;
        }

        let recognition = null;
        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = false;
            recognition.lang = 'en-US'; // Can be changed for multilingual

            recognition.onstart = () => {
                voiceBtn.classList.add('active');
                listeningIndicator.style.display = 'block';
            };

            recognition.onend = () => {
                voiceBtn.classList.remove('active');
                listeningIndicator.style.display = 'none';
            };

            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                messageInput.value = transcript;
                // Automatically send the voice input
                sendMessage(transcript);
            };

            recognition.onerror = (event) => {
                console.error('Speech recognition error', event.error);
                voiceBtn.classList.remove('active');
                listeningIndicator.style.display = 'none';
                alert('Voice recognition error: ' + event.error);
            };
        }

        // Voice button click
        voiceBtn.addEventListener('click', () => {
            if (recognition) {
                recognition.start();
            } else {
                alert('Voice recognition not supported');
            }
        });

        // Send button click
        sendBtn.addEventListener('click', () => {
            const text = messageInput.value.trim();
            if (text) {
                sendMessage(text);
                messageInput.value = '';
            }
        });

        // Enter key in input
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                sendBtn.click();
            }
        });

        // Function to send message to backend
        function sendMessage(text) {
            // Display user message immediately
            addMessage('user', text);

            // Send to backend
            fetch('/audio_graph', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ user_query: text }),
                credentials: 'include'  // Important for session cookie
            })
            .then(response => response.json())
            .then(data => {
                const assistantReply = data.response;
                addMessage('assistant', assistantReply);
                speakText(assistantReply);  // TTS
            })
            .catch(error => {
                console.error('Error:', error);
                addMessage('assistant', 'Sorry, something went wrong. Please try again.');
            });
        }

        // Add a message to the chat window
        function addMessage(role, content) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role}-message`;

            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            bubble.textContent = content;

            // Optional timestamp
            const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            const timeDiv = document.createElement('div');
            timeDiv.className = 'timestamp';
            timeDiv.textContent = time;

            messageDiv.appendChild(bubble);
            messageDiv.appendChild(timeDiv);
            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight; // Scroll to bottom
        }

        // Text-to-Speech using browser's built-in
        function speakText(text) {
            if (!synth) {
                console.warn('Text-to-speech not supported');
                return;
            }
            // Cancel any ongoing speech
            synth.cancel();

            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            utterance.rate = 1;
            utterance.pitch = 1;
            synth.speak(utterance);
        }

        // Optional: Load previous messages on page load? Not implemented in backend, but we can start empty.
        // For demonstration, add a welcome message
        window.onload = function() {
            addMessage('assistant', 'Hello! I am your AI farming assistant. How can I help you today? You can type or use the voice button.');
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
