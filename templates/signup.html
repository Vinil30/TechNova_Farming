<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Kisan AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            padding: 40px 0;
        }
        .signup-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            padding: 40px;
            max-width: 600px;
            margin: 0 auto;
        }
        .signup-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .signup-header i {
            font-size: 3rem;
            color: #28a745;
        }
        .btn-success {
            background-color: #28a745;
            border: none;
            width: 100%;
            padding: 12px;
            font-size: 1.1rem;
        }
        .alert {
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="signup-card">
        <div class="signup-header">
            <i class="fas fa-seedling"></i>
            <h2 class="mt-3">Farmer Registration</h2>
            <p class="text-muted">Join Kisan AI for smart farming</p>
        </div>

        {% with messages = get_flashed_messages() %}
          {% if messages %}
            {% for message in messages %}
              <div class="alert alert-warning alert-dismissible fade show" role="alert">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
              </div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form action="/signup" method="POST">
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="name" class="form-label">Full Name *</label>
                    <input type="text" class="form-control" id="name" name="name" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label for="email" class="form-label">Email *</label>
                    <input type="email" class="form-control" id="email" name="email" required>
                </div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="password" class="form-label">Password *</label>
                    <input type="password" class="form-control" id="password" name="password" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label for="phone" class="form-label">Phone (optional)</label>
                    <input type="text" class="form-control" id="phone" name="phone">
                </div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="location" class="form-label">Location/Village</label>
                    <input type="text" class="form-control" id="location" name="location">
                </div>
                <div class="col-md-6 mb-3">
                    <label for="farm_size" class="form-label">Farm Size (acres)</label>
                    <input type="number" step="0.1" class="form-control" id="farm_size" name="farm_size">
                </div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="soil_type" class="form-label">Soil Type</label>
                    <select class="form-select" id="soil_type" name="soil_type">
                        <option value="">Select</option>
                        <option value="Clay">Clay</option>
                        <option value="Sandy">Sandy</option>
                        <option value="Loamy">Loamy</option>
                        <option value="Silt">Silt</option>
                        <option value="Peaty">Peaty</option>
                        <option value="Chalky">Chalky</option>
                    </select>
                </div>
                <div class="col-md-6 mb-3">
                    <label for="water_availabilty" class="form-label">Water Availability</label>
                    <select class="form-select" id="water_availabilty" name="water_availabilty">
                        <option value="">Select</option>
                        <option value="High">High (canal/well)</option>
                        <option value="Medium">Medium (seasonal)</option>
                        <option value="Low">Low (rain‑fed)</option>
                    </select>
                </div>
            </div>

            <div class="mb-3">
                <label for="prev_crop" class="form-label">Previous Crop Grown</label>
                <input type="text" class="form-control" id="prev_crop" name="prev_crop">
            </div>

            <button type="submit" class="btn btn-success">Register</button>
        </form>
        <div class="text-center mt-3">
            <p>Already have an account? <a href="/login">Login</a></p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
